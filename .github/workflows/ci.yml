name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: splitapp
          POSTGRES_PASSWORD: splitapp
          POSTGRES_DB: splitapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U splitapp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The test fixture drops and recreates the public schema: scratch DB only.
      TEST_DATABASE_URL: postgresql+psycopg://splitapp:splitapp@localhost:5432/splitapp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as backend/Dockerfile (python:3.12-slim)
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migration round trip (upgrade, downgrade to base, upgrade)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Lint the OpenAPI contract
        run: npm run api:lint
      - name: Generated client matches the contract (no hand edits)
        run: |
          npm run api:generate
          # The committed copy is prettier-formatted; orval's raw output is not.
          npx prettier --write src/api/generated
          git diff --exit-code -- src/api/generated
          # git diff ignores untracked files: fail if generation produced a file that is not committed.
          test -z "$(git status --porcelain -- src/api/generated)"
      - run: npm run typecheck
      - run: npx eslint .
      - run: npx jest --ci
